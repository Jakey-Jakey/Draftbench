# Enable initial draft leaderboard to pick best seed per model
# Generates multiple drafts per model, then runs round-robin to select the best
# This preset overrides tournament settings only.
# If you run this via `--config`, any missing sections (like [roles]) come from
# the built-in defaults in `config.ts`. Copy your [roles] from config.toml into
# this file if you want to use your own models.

[tournament]
coarseRounds = 7
coarseFormat = "1v1v1"

[tournament.firstDraftSelection]
enabled = true
initialGenerations = 3  # Generate 3 drafts per model
# style = "per-model-pairwise"  # Options: per-model-pairwise (default), global-pairwise, per-model-rank, global-rank

[tournament.stopRules]
topK = 8

[tournament.fineRanking]
enabled = true
maxMatchesPerBatch = 4
maxTotalMatches = 30
targetWinProb = 0.5
confidence = 0.9
minSeparation = 0
allowOverRepeatCap = false
