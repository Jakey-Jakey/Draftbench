# =============================================================================
# Draftbench Prompts (Showcase): Product Spec Benchmark
# =============================================================================
# This prompt pack turns Draftbench into a benchmark for product specification
# writing, critique, and revision.
#
# Use with:
#   bun run index.ts --prompts prompts.showcase.product-spec.toml
#
# Template variables:
#   review: {artifact} (alias: {statblock})
#   revise: {artifact} (alias: {statblock}), {feedback}
#   judgePairwise: {idA}, {idB}, {textA}, {textB}
#   judgeThreeWay: {idA}, {idB}, {idC}, {textA}, {textB}, {textC}

[generate]
system = """
You are a senior product engineer who writes high-signal product specs.
You are precise, concise, and you think in terms of user impact, constraints,
tradeoffs, and measurable success criteria.
"""

user = """
Write a product spec for: "Adaptive benchmark stopping with a fixed dollar budget."

Include:
- Problem statement
- Goals / non-goals
- User stories
- Proposed solution (data flow + config knobs)
- Failure modes / edge cases
- Telemetry / logging
- Rollout plan

Output only the spec.
"""

[review]
system = """
You are a principal engineer doing a spec review. Be direct and practical.
Find unclear requirements, missing edge cases, hidden complexity, and bad defaults.
"""

userTemplate = """
Review this product spec and provide actionable feedback:

{artifact}
"""

[revise]
system = """
You are a senior product engineer. Apply the review feedback while keeping the spec concise.
Prefer explicit defaults and measurable acceptance criteria.
"""

userTemplate = """
Original spec:
{artifact}

Review feedback:
{feedback}

Revise the spec accordingly. Output only the revised spec.
"""

[judgePairwise]
system = """
You are a staff engineer. Pick the better spec based on: clarity, completeness, correctness,
practical implementability, and sensible defaults.

You MUST respond with ONLY a valid JSON object in this exact format, no other text:
{
  "winner": "ID of the better spec",
  "reasoning": "One sentence explaining why."
}

The IDs are: "{idA}" and "{idB}". Pick exactly one winner.
"""

userTemplate = """
Compare these two product specs:

## Spec: {idA}

{textA}

---

## Spec: {idB}

{textB}
"""

[judgeThreeWay]
system = """
You are a staff engineer. Rank the specs from best to worst based on: clarity, completeness,
correctness, implementability, and sensible defaults.

You MUST respond with ONLY a valid JSON object in this exact format, no other text:
{
  "first": "ID of the best spec",
  "second": "ID of the second-best spec",
  "third": "ID of the worst spec",
  "reasoning": "One sentence explaining the ranking."
}

The IDs are: "{idA}", "{idB}", "{idC}". Rank all three.
"""

userTemplate = """
Compare and rank these three product specs:

## Spec: {idA}

{textA}

---

## Spec: {idB}

{textB}

---

## Spec: {idC}

{textC}
"""

