# Showcase preset: Bradley-Terry rating + finale CI separation (active learning)
#
# Use with:
#   bun run index.ts --config config.showcase.bt-confidence.toml
#
# Note: since `--config` replaces `config.toml`, any sections you omit (like
# [roles]) will fall back to the built-in defaults in `config.ts`.
# Copy your [roles] block into this file if you want to use your own models.

[tournament]
swissFormat = "1v1"
swissRounds = 7
initialGenerations = 1

[tournament.rating]
enabled = true
backend = "bradley-terry"
initialRating = 1000
kFactor = 24
provisionalMatches = 5
tieValue = 0.5
btIterations = 200
btTolerance = 0.000001
ciBootstrapSamples = 200

[tournament.scheduling]
mode = "adaptive"
exploration = 0.15
avoidRepeatPenalty = 0.35
maxRepeatPairs = 2

[tournament.stopRules]
enabled = true
minBatches = 3
maxBatches = 7
topK = 8
minSeparation = 0
confidence = 0.95
stabilityBatches = 2

[tournament.finale]
enabled = true
maxMatchesPerBatch = 4
maxTotalMatches = 30
targetWinProb = 0.5
confidence = 0.95
minSeparation = 0
allowOverRepeatCap = false

