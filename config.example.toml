# =============================================================================
# Draftbench Configuration
# =============================================================================
# TOML config file. Comments start with #
# See agents.md for full documentation.

# -----------------------------------------------------------------------------
# ROLES: Define which models perform each role and their reasoning effort
# -----------------------------------------------------------------------------
# Each role is an array of { model, effort } entries.
# - model: OpenRouter slug (e.g., "anthropic/claude-sonnet-4")
# - effort: "xhigh" | "high" | "medium" | "low" | "minimal" | "none"

[roles]

# Generators: Create initial drafts
[[roles.generators]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.generators]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.generators]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Reviewers: Critique drafts and provide feedback
[[roles.reviewers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.reviewers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.reviewers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Revisers: Improve drafts based on review feedback
[[roles.revisers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.revisers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.revisers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Swiss Tournament Judges (single or multi-judge voting)
[[roles.swissJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

# Optional second Swiss judge (enables multi-judge Swiss voting)
# [[roles.swissJudges]]
# model = "openai/gpt-5.2"
# effort = "low"

# Playoff Judges (multi-judge voting for fairness)
[[roles.playoffJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

[[roles.playoffJudges]]
model = "openai/gpt-5.2"
effort = "medium"

# -----------------------------------------------------------------------------
# TOURNAMENT SETTINGS
# -----------------------------------------------------------------------------

[tournament]
initialGenerations = 1      # Drafts per generator model
swissRounds = 7             # Number of Swiss rounds
playoffSize = 8             # Top N advance to playoffs
swissFormat = "1v1v1"       # "1v1" or "1v1v1"

[tournament.initialLeaderboard]
enabled = false             # Enable seed selection round-robin (TURN THIS ON IF YOU HAVE MORE THAN 1 INITIAL GENERATION)
# style = "per-model-pairwise"  # per-model-pairwise (default), global-pairwise, per-model-rank, global-rank

[tournament.rating]
enabled = true
backend = "elo"
kFactor = 24
initialRating = 1500
provisionalMatches = 12
tieValue = 0.5
btIterations = 200
btTolerance = 0.000001
ciBootstrapSamples = 200

[tournament.scheduling]
mode = "adaptive"
exploration = 0.15
avoidRepeatPenalty = 0.35
maxRepeatPairs = 2

[tournament.stopRules]
enabled = true
minBatches = 3
maxBatches = 7
topK = 8
minSeparation = 65
confidence = 0.9
stabilityBatches = 2
# budgetMaxCalls = 600

# -----------------------------------------------------------------------------
# CONCURRENCY (Optional)
# -----------------------------------------------------------------------------

[concurrency]
maxParallel = 5             # Limit parallel API calls (omit for unlimited)

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------

[output]
runsDirectory = "runs"
