# =============================================================================
# Draftbench Default Configuration
# =============================================================================
# This file shows ALL default settings for reference.
# You don't need to copy this - just override what you want in config.toml

# -----------------------------------------------------------------------------
# ROLES: Which models perform each role
# -----------------------------------------------------------------------------

[roles]

# Generators: Create initial drafts
[[roles.generators]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.generators]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.generators]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Reviewers: Critique and provide feedback
[[roles.reviewers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.reviewers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.reviewers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Revisers: Improve drafts based on feedback
[[roles.revisers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.revisers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.revisers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Coarse Ranking Judges (Swiss; single or multi-judge voting)
[[roles.coarseJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

# Optional second Swiss judge (enables multi-judge Swiss voting)
# [[roles.coarseJudges]]
# model = "openai/gpt-5.2"
# effort = "low"

# Fine Ranking Judges (multi-judge voting for fairness)
[[roles.fineJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

[[roles.fineJudges]]
model = "openai/gpt-5.2"
effort = "medium"

# -----------------------------------------------------------------------------
# TOURNAMENT SETTINGS
# -----------------------------------------------------------------------------

[tournament]
coarseRounds = 7            # Number of Swiss tournament rounds
coarseFormat = "1v1v1"      # "1v1" (pairwise) or "1v1v1" (three-way)

[tournament.firstDraftSelection]
enabled = false             # First draft selection to pick best draft per model
initialGenerations = 1      # Drafts per generator model
# style = "per-model-pairwise"  # Options: per-model-pairwise (default), global-pairwise, per-model-rank, global-rank

[tournament.rating]
enabled = true
backend = "elo"             # "elo" or "bradley-terry"
kFactor = 24
initialRating = 1000
provisionalMatches = 5      # rating/engine.ts: uses 1.4x K-factor while record.matches < provisionalMatches
tieValue = 0.5              # Draw score in pairwise space
btIterations = 200
btTolerance = 0.000001
ciBootstrapSamples = 200
btRegularization = 0.01     # L2 regularization for BT (shrinks toward mean; 0 = disabled)
btUseNewton = true          # Per-player Hessian step sizes for BT (faster convergence)
ciMode = "hessian"          # CI mode: "bootstrap", "hessian" (analytic, BT only), or "normal" (z*uncertainty)

[tournament.scheduling]
mode = "adaptive"           # "adaptive" or "static"
exploration = 0.15          # 0-1 random exploration budget
avoidRepeatPenalty = 0.35   # Penalty weight for repeated pairs
maxRepeatPairs = 2          # Hard repeat cap per pair before fallback
scoringMode = "fisher"      # Pair scoring: "heuristic" (original composite) or "fisher" (Fisher-information-weighted)

# Coarse Early Stop Rules (coarse ranking only)
[tournament.stopRules]
enabled = true
minBatches = 3
maxBatches = 7              # Hard cap for coarse batches (<= coarseRounds)
topK = 8                    # Evaluate separation at the top-K boundary
minSeparation = 65          # Rating-point separation target (set to 0 to disable)
confidence = 0.9
stabilityBatches = 2        # Require same topK for N consecutive batches
# budgetMaxCalls = 600       # Optional hard API-call budget for Swiss phase

[tournament.fineRanking]
# Fine ranking: active-learning Top-K refinement matches after coarse ranking (Swiss rounds).
enabled = true
maxMatchesPerBatch = 4          # parallel matches per iteration
maxTotalMatches = 30            # cap across the whole finale
targetWinProb = 0.5             # prioritize matchups with predicted win prob near this target
confidence = 0.9                # CI separation confidence
minSeparation = 0               # rating-gap fallback (0 disables)
allowOverRepeatCap = false      # if false, respects tournament.scheduling.maxRepeatPairs

# -----------------------------------------------------------------------------
# CONCURRENCY
# -----------------------------------------------------------------------------
# Omit this section (or set maxParallel = 0) for unlimited parallel API calls

# [concurrency]
# maxParallel = 5           # Limit parallel API calls

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------

[output]
runsDirectory = "runs"      # Where run outputs are saved

# -----------------------------------------------------------------------------
# PROMPTS
# -----------------------------------------------------------------------------
# See prompts.toml for customizable prompts, or override inline below.
# Use --prompts <file.toml> CLI flag to load a different prompts file.
