# Option B: cheaper seeding + stronger top-8 ordering
# Usage:
#   bun run index.ts --config config.option-b.top8-ordering.toml

[roles]

# Generators: Create initial drafts
[[roles.generators]]
model = "moonshotai/kimi-k2.5"
effort = "high"

[[roles.generators]]
model = "openrouter/pony-alpha"
effort = "high"

[[roles.generators]]
model = "deepseek/deepseek-v3.2"
effort = "high"

# Reviewers: Critique and provide feedback
[[roles.reviewers]]
model = "moonshotai/kimi-k2.5"
effort = "high"

[[roles.reviewers]]
model = "openrouter/pony-alpha"
effort = "high"

[[roles.reviewers]]
model = "deepseek/deepseek-v3.2"
effort = "high"

# Revisers: Improve drafts based on feedback
[[roles.revisers]]
model = "moonshotai/kimi-k2.5"
effort = "high"

[[roles.revisers]]
model = "openrouter/pony-alpha"
effort = "high"

[[roles.revisers]]
model = "deepseek/deepseek-v3.2"
effort = "high"

# Coarse Ranking Judges
[[roles.coarseJudges]]
model = "anthropic/claude-opus-4.6"
effort = "low"

# Fine Ranking Judges (multi-judge voting)
[[roles.fineJudges]]
model = "anthropic/claude-opus-4.6"
effort = "low"

[[roles.fineJudges]]
model = "openai/gpt-5.2"
effort = "medium"


[tournament]
coarseRounds = 7
coarseFormat = "1v1v1"

[tournament.firstDraftSelection]
enabled = true
# Big cost win vs per-model-pairwise: 1 ranking call per generator model
style = "per-model-rank"
initialGenerations = 5

[tournament.rating]
enabled = true
backend = "elo"
kFactor = 24
initialRating = 1000
provisionalMatches = 5
tieValue = 0.5
btIterations = 200
btTolerance = 0.000001
ciBootstrapSamples = 200

[tournament.scheduling]
mode = "adaptive"
exploration = 0.15
avoidRepeatPenalty = 0.35
# Encourage broader pair coverage in top-K refinement without deadlocking scheduling
maxRepeatPairs = 2

[tournament.stopRules]
enabled = true
minBatches = 3
maxBatches = 7
topK = 8
minSeparation = 65
confidence = 0.9
stabilityBatches = 2

[tournament.fineRanking]
enabled = true
maxMatchesPerBatch = 4
# More refinement budget for top-8 ordering than default config.toml
maxTotalMatches = 40
targetWinProb = 0.5
confidence = 0.9
minSeparation = 0
# Allow repeats if Swiss already used up the repeat cap for top-K pairs; avoids finale deadlocks.
allowOverRepeatCap = true

[output]
runsDirectory = "runs"
