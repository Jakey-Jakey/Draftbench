# Swiss 1v1 format (pairwise matches instead of default 3-way)
# This preset overrides tournament settings only.
# If you run this via `--config`, any missing sections (like [roles]) come from
# the built-in defaults in `config.ts`. Copy your [roles] from config.toml into
# this file if you want to use your own models.

[tournament]
swissFormat = "1v1"
swissRounds = 5

[tournament.scheduling]
mode = "adaptive"

[tournament.stopRules]
enabled = true
maxBatches = 5

[tournament.finale]
enabled = true
maxMatchesPerBatch = 4
maxTotalMatches = 20
targetWinProb = 0.5
confidence = 0.9
minSeparation = 0
allowOverRepeatCap = false
