# =============================================================================
# Draftbench Configuration
# =============================================================================
# This is the main config file. Customize settings here.
# See config.default.toml for all available options with documentation.
# See prompts.toml to customize prompts (load with --prompts flag).

# -----------------------------------------------------------------------------
# ROLES: Which models perform each role
# -----------------------------------------------------------------------------

[roles]

# Generators: Create initial drafts
[[roles.generators]]
model = "openai/gpt-5.2"
effort = "xhigh"

[[roles.generators]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.generators]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Reviewers: Critique and provide feedback
[[roles.reviewers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.reviewers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.reviewers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Revisers: Improve drafts based on feedback
[[roles.revisers]]
model = "openai/gpt-5.2"
effort = "high"

[[roles.revisers]]
model = "anthropic/claude-opus-4.5"
effort = "high"

[[roles.revisers]]
model = "google/gemini-3-pro-preview"
effort = "high"

# Swiss Tournament Judges (single or multi-judge voting)
[[roles.swissJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

# Playoff Judges (multi-judge voting)
[[roles.playoffJudges]]
model = "anthropic/claude-opus-4.5"
effort = "low"

[[roles.playoffJudges]]
model = "openai/gpt-5.2"
effort = "medium"

# -----------------------------------------------------------------------------
# TOURNAMENT
# -----------------------------------------------------------------------------

[tournament]
initialGenerations = 5
swissRounds = 7
playoffSize = 8
swissFormat = "1v1v1"

[tournament.initialLeaderboard]
enabled = true

[tournament.rating]
enabled = true
backend = "elo"
kFactor = 24
initialRating = 1500
provisionalMatches = 12
tieValue = 0.5
btIterations = 200
btTolerance = 0.000001
ciBootstrapSamples = 200

[tournament.scheduling]
mode = "adaptive"
exploration = 0.15
avoidRepeatPenalty = 0.35
maxRepeatPairs = 2

[tournament.stopRules]
enabled = true
minBatches = 3
maxBatches = 7
topK = 8
minSeparation = 65          # Set to 0 to disable separation check
confidence = 0.9
stabilityBatches = 2

# -----------------------------------------------------------------------------
# CONCURRENCY (uncomment to limit parallel API calls)
# -----------------------------------------------------------------------------

# [concurrency]
# maxParallel = 5

# -----------------------------------------------------------------------------
# OUTPUT
# -----------------------------------------------------------------------------

[output]
runsDirectory = "runs"
